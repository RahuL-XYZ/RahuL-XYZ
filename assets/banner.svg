<style>
.w{fill:none;stroke:#a9bbff;stroke-width:1.2;stroke-dasharray:1;stroke-dashoffset:1;opacity:.55;animation:draw 2.2s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.web{animation:breathe 7s ease-in-out infinite}
@keyframes breathe{50%{opacity:.6}}
.swing{transform-origin:200px 0;animation:swing 4.2s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.drop{animation:drop 2s cubic-bezier(.3,1.4,.5,1) both}
@keyframes drop{from{transform:translateY(-190px)}to{transform:translateY(0)}}
.g1,.g2{opacity:0;mix-blend-mode:screen}
.g1{animation:gl1 6s steps(1) infinite 3s} .g2{animation:gl2 6s steps(1) infinite 3s}
@keyframes gl1{0%,90%{opacity:0}91%{opacity:.9;transform:translate(-5px,1px)}93%{opacity:.9;transform:translate(4px,-2px)}95%{opacity:0}}
@keyframes gl2{0%,90%{opacity:0}92%{opacity:.9;transform:translate(5px,-1px)}94%{opacity:.9;transform:translate(-4px,2px)}96%{opacity:0}}
.t{font-family:Impact,'Arial Black','Segoe UI Black',sans-serif;font-size:92px;letter-spacing:3px}
.s{font-family:'SFMono-Regular',Consolas,'Courier New',monospace;font-size:22px;font-weight:700;fill:#e8ecff}
.tag{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:17px;fill:#9aa6d6;opacity:0;animation:fin 1.4s ease 5.2s forwards}
@keyframes fin{to{opacity:1}}
.ttlin{animation:ttl 1s cubic-bezier(.2,.9,.2,1) .4s both}
@keyframes ttl{from{opacity:0;transform:translateX(-40px) skewX(-10deg)}to{opacity:1;transform:none}}
.p{animation:float linear infinite;opacity:.0}
@keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-170px);opacity:0}}
.sweep{animation:sweep 3.6s ease-in-out infinite 2s}
@keyframes sweep{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}
.blink{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.w{stroke-dashoffset:0}}
</style>
