name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%23E23636&color_dots=%23161b3a,%23402040,%23802a4a,%23c0303f,%23ff4040
            dist/snake-dark.svg?palette=github-dark&color_snake=%23E23636&color_dots=%23161b3a,%23402040,%23802a4a,%23c0303f,%23ff4040
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
